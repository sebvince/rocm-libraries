#
# Correctness companion to subtile_mxfp4_gfx1250_mt256x256_pgr2_cluster4x4_nosk.yaml.
# Same kernel configuration, but element-wise validated (NumElementsToValidate: -1)
# on small problems so a full CPU reference comparison is cheap.
#
# Sizes are exact multiples of the macro tile (256x256) and of DepthU (256), so
# this covers the steady-state path before any edge/tail handling.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx950, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-stinkytofu]

GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  ValidationMaxToPrint: 8
  ValidationPrintValids: False
  NumWarmups: 0
  EnqueuesPerSync: 1
  NumBenchmarks: 1
  PrintWinnersOnly: False
  PrintLevel: 2
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeD: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0
  Architecture: gfx1250
  ISA: [[12, 5, 0]]
  PrintSolutionRejectionReason: True

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      DataTypeMXSA: e8
      DataTypeMXSB: e8
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]  # MT 256x256 WG 2x2
        - DepthU: [256]
        - WavefrontSize: [32]
        - PrefetchGlobalRead: [2]
        - PrefetchGL2: [0]
        - ScheduleIterAlg: [3]
        - UseSubtileImpl: [true]
        - StreamK: [0]
        - TDMInst: [3]
        - StaggerU: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsPadMXSA: [-1]
        - LdsPadMXSB: [-1]
        - 1LDSBuffer: [0]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - GlobalSplitU: [1]
        - PreloadKernArgs: [False]
        - ClusterDim: [[4, 4]]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [1024, 1024, 1, 256]    # K = 1*DepthU, 4x4 tile grid = one cluster
          - Exact: [1024, 1024, 1, 512]    # K = 2*DepthU
          - Exact: [1024, 1024, 1, 1024]   # K = 4*DepthU
